<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasgow Bike-Share Explorer</title>
<meta name="description" content="Interactive walk-through of an MSc dissertation on Glasgow's nextbike bike-share system: station flows, neighbourhoods, the cycle-infrastructure timeline, k-means commuter corridors and a negative-binomial gravity model.">
<!-- Link previews (LinkedIn, etc.). og:image must be an absolute URL. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Glasgow Bike-Share Explorer">
<meta property="og:description" content="1.2 million bike-share trips, cycle infrastructure and commuter corridors in Glasgow: an interactive MSc dissertation.">
<meta property="og:url" content="https://calumslanghub.github.io/GlasgowBSS-Explorer/">
<meta property="og:image" content="https://calumslanghub.github.io/GlasgowBSS-Explorer/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Plotly (the k-means scatter) is loaded on demand by renderers.js. -->
</head>
<body>

<header id="topbar">
  <a id="brand" href="#top">Glasgow Bike-Share Explorer</a>
  <nav id="nav" aria-label="Sections"></nav>
</header>

<main id="page">
  <section id="top" class="hero">
    <h1 id="hero-title">Glasgow Bike-Share Explorer</h1>
    <p id="hero-sub" class="hero-sub"></p>
    <p id="hero-text" class="hero-text">Loading the data…</p>
    <div id="hero-kpis" class="hero-kpis"></div>
  </section>

  <div id="sections"></div>

  <footer id="page-foot"><p id="foot-text"></p></footer>
</main>

<!-- One page section; app.js clones this per manifest view. Elements are
     found by data-el within the section, never by global id. -->
<template id="tpl-section">
  <section class="sec">
    <h2 class="sec-title" data-el="title"></h2>
    <div class="sec-text" data-el="text"></div>
    <div class="sec-wide" data-el="wide" hidden></div>
    <h3 class="map-title" data-el="map-title" hidden></h3>
    <div class="sec-body">
      <div class="sec-scatter" data-el="scatter"></div>
      <div class="map-wrap" data-el="map-wrap">
        <div class="map" data-el="map" role="application" aria-label="Map"></div>
        <div class="map-toolbar" data-el="toolbar">
          <div class="station-picker" data-el="station-picker">
            <select class="station-select" data-el="station-select" aria-label="Selected station"></select>
          </div>
          <div class="map-legend" data-el="legend" aria-label="Map legend (click an item to show or hide it)"></div>
        </div>
        <div class="timeline" data-el="timeline" hidden>
          <button class="tl-play" data-el="tl-play" type="button" aria-label="Play">&#9654;</button>
          <input class="tl-slider" data-el="tl-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Position">
          <div class="tl-date" data-el="tl-date"></div>
          <button class="tl-reset" data-el="tl-reset" type="button" title="Back to all-day view" hidden>&times;</button>
          <div class="tl-ticks" data-el="tl-ticks"></div>
          <div class="tl-hint" data-el="tl-hint"></div>
        </div>
      </div>
      <aside class="panel" data-el="panel">
        <div class="panel-head">
          <h4 class="panel-station" data-el="panel-station"></h4>
          <p class="panel-hint" data-el="panel-hint"></p>
        </div>
        <div class="panel-body" data-el="panel-body"></div>
      </aside>
    </div>
  </section>
</template>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/renderers.js"></script>
<script src="js/map.js"></script>
<script src="js/timeline.js"></script>
<script src="js/app.js"></script>
</body>
</html>
