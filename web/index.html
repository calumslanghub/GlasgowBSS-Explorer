<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasgow Bike-Share Explorer</title>
<meta name="description" content="Interactive dashboard of Glasgow's nextbike bike-share system: station flows by weekday and weekend, neighbourhood census maps, the cycle-infrastructure timeline, commuter corridors and the regression results. MSc dissertation portfolio piece.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header id="topbar">
  <div id="brand">
    <span id="brand-title">Glasgow Bike-Share Explorer</span>
    <span id="brand-sub">nextbike Glasgow, Sep 2017 to Apr 2024 · an MSc dissertation in five pages</span>
  </div>
  <nav id="view-tabs" aria-label="Views"></nav>
</header>

<main id="body">
  <section id="map-wrap">
    <div id="map" role="application" aria-label="Station map"></div>

    <div id="map-toolbar">
      <div id="station-picker">
        <label for="station-select" class="sr-only">Selected station</label>
        <select id="station-select"></select>
      </div>
      <div id="map-legend" aria-label="Map legend (click an item to show or hide it)"></div>
    </div>

    <div id="timeline" hidden>
      <button id="tl-play" type="button" aria-label="Play">&#9654;</button>
      <input id="tl-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Position">
      <div id="tl-date"></div>
      <button id="tl-reset" type="button" title="Back to all-day view" hidden>&times;</button>
      <div id="tl-ticks"></div>
      <div id="tl-hint"></div>
    </div>
  </section>

  <aside id="panel">
    <div id="panel-head">
      <h1 id="panel-station">Select a station</h1>
      <p id="panel-hint">Click a marker on the map, or pick a station from the list.</p>
    </div>
    <div id="panel-body"></div>
    <footer id="panel-foot">
      <p id="foot-text"></p>
    </footer>
  </aside>
</main>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/renderers.js"></script>
<script src="js/map.js"></script>
<script src="js/timeline.js"></script>
<script src="js/app.js"></script>
</body>
</html>
