# Palette. Mode colours come from the dissertation (v4git/build/constants.R)
# so the dashboard looks coherent with the rest of the portfolio.

roles:
  origin: "#0065bd"        # trips that START at the selected station (blue)
  destination: "#d32205"   # trips that END at the selected station (red)

infra:
  segregated: "#1a7032"    # Walk/dark green
  lane: "#5eb135"          # Cycle green
  shared: "#28a197"        # teal
  mixed: "#fdd522"         # yellow

corridor:
  commuter: "#741e6d"      # purple
  "non-commuter": "#28a197"  # teal (unlabelled pairs are counted here)

daytype:
  weekday: "#4b3f8f"       # indigo
  weekend: "#e8871e"       # orange

# Sequential ramp for the census choropleth (low -> mid -> high).
scale:
  low: "#e0ecf4"
  mid: "#6497c7"
  high: "#023858"

# Residents vs workplace population.
balance:
  residents: "#5eb135"     # Cycle green
  workplace: "#741e6d"     # purple (where commuters go)

# Coefficient-plot groups.
regression:
  gravity: "#5e5e5e"
  infrastructure: "#1a7032"
  neighbourhood: "#0065bd"
  commuter: "#741e6d"

ui:
  accent: "#0065bd"
  ink: "#1a1a1a"
  muted: "#5e5e5e"
  station: "#002d54"
  station_selected: "#fdd522"
  station_dim: "#b3b3b3"
