# Palette. Mode colours come from the dissertation (v4git/build/constants.R)
# so the dashboard looks coherent with the rest of the portfolio.

roles:
  origin: "#0065bd"        # trips that START at the selected station (blue)
  destination: "#d32205"   # trips that END at the selected station (red)

infra:
  segregated: "#1a7032"    # Walk/dark green
  lane: "#5eb135"          # Cycle green
  shared: "#28a197"        # teal
  mixed: "#fdd522"         # yellow

corridor:
  commuter: "#b04fa8"      # purple (lifted from the dissertation #741e6d to read on the dark map)
  "non-commuter": "#28a197"  # teal (unlabelled pairs are counted here)

daytype:
  weekday: "#4b3f8f"       # indigo
  weekend: "#e8871e"       # orange

# Sequential ramp for the census choropleth (low -> mid -> high).
scale:
  low: "#e0ecf4"
  mid: "#6497c7"
  high: "#023858"

# Residents vs workplace population.
balance:
  residents: "#5eb135"     # Cycle green
  workplace: "#b04fa8"     # purple (where commuters go)
  median: "#9e9e9e"        # grey (median station, beside the pooled bar)

# Coefficient-plot groups.
regression:
  gravity: "#5e5e5e"
  infrastructure: "#1a7032"
  neighbourhood: "#0065bd"
  commuter: "#b04fa8"

ui:
  accent: "#0065bd"
  ink: "#1a1a1a"
  muted: "#5e5e5e"
  station: "#002d54"
  station_selected: "#fdd522"
  station_dim: "#b3b3b3"
  highlight: "#c49a00"     # dark gold: the selected station in charts

# Dark grey basemap (Esri Dark Gray Canvas). Station dots are light so they read
# on it; the ui.station navy stays for charts on the white side panel.
basemap:
  station: "#e6edf5"
  station_line: "#1b1f24"
  oa_line: "#30343b"
  bg: "#2b2d31"
