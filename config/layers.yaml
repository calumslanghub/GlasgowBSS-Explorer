# Layer manifest. Every renderable panel is an entry here: which JSON file it
# reads, which field inside the per-station object, and which GENERIC renderer
# draws it. The build copies this (plus colours.yaml) into web/data/manifest.json
# and the JS never hard-codes a panel. Adding a view = a build function that
# writes JSON + an entry here.
#
# Renderers (web/js/renderers.js):
#   bar   - Chart.js bar. meta: orientation (horizontal|vertical), series
#           ([{key,label,colour}]) OR value_key + colour, label_key, stacked,
#           percent (normalise each category to 100), colour_key + colour_map
#           (per-bar colour by a category field), x_key (for vertical charts),
#           intervals ([{lo_key,hi_key,point_key,label,colour,thickness}] ->
#           floating bars, e.g. a coefficient plot), dumbbell ({a:{key,label,
#           colour}, b:{...}} -> two points joined by a bar), ref_line (x value
#           for a dashed guide), tip_keys ([{key,label,dp,unit}] extra tooltip
#           lines), marker (state key highlighted on the x axis).
#   line  - Chart.js multi-line series. meta: x_key, x_type (date|number),
#           x_unit, x_label, series, fill, stacked, secondary, y_label, unit,
#           ref_line, marker (name of a state value to draw a vertical guide at).
#   kpi   - stat tiles / key-value grid. meta: items [{key,label,unit,dp}] or
#           items_from {file, field} (metadata object {key: {label,unit,dp}}),
#           at_marker (index a timeline by a state value), compact.
#   text  - a short narrative card. meta: body (HTML; {key} placeholders are
#           filled from the layer's data object, {summary.key} from the build
#           summary).
#
# Data lookup (web/js/data.js layerData):
#   scope: station     -> files[file][S.station]
#   scope: global      -> files[file]
#   field_from_state   -> one or more extra hops through S[<key>] (string|list)
#   field              -> final hop(s); dotted paths allowed ("compare.dest")
#   path               -> explicit ordered hops instead of the two above; a
#                         "$key" hop reads S[key] (e.g. [rank, $census_var, $buffer])
#   Titles and subtitles may use {daytype}, {buffer}, {census_var} placeholders
#   which are replaced by the active control's option label.
#
# Visibility: `show_if` is a map of state conditions that must all hold, e.g.
#   { station: false } (no station selected), { nbhd_mode: buffers }.
#   Station-scope layers are skipped without a station regardless.

controls:
  # Rendered in the map legend; each sets one state key and re-renders.
  daytype:
    label: "Days"
    state: daytype
    widget: radio
    hash: day
    options:
      - { value: all, label: "All days", colour: "$ui.station" }
      - { value: weekday, label: "Weekdays", colour: "$daytype.weekday" }
      - { value: weekend, label: "Weekends", colour: "$daytype.weekend" }
  nbhd_mode:
    label: "Show"
    state: nbhd_mode
    widget: radio
    hash: mode
    options:
      - { value: buffers, label: "Census buffers", colour: "$scale.mid" }
      - { value: bars, label: "Residents vs workplace", colour: "$balance.workplace" }
  census_var:
    label: "Variable"
    state: census_var
    widget: select
    hash: var
    options_from: { file: census_summary.json, field: vars }
    show_if: { nbhd_mode: buffers }
  buffer:
    label: "Buffer"
    state: buffer
    widget: radio
    hash: buf
    options:
      - { value: "150", label: "150 m" }
      - { value: "250", label: "250 m" }
      - { value: "500", label: "500 m" }
      - { value: "750", label: "750 m" }
  segmode:
    label: "Segregated"
    state: seg_mode
    widget: radio
    hash: seg
    options:
      - { value: all, label: "All trips", colour: "$infra.segregated" }
      - { value: commuter, label: "Commuter corridors only", colour: "$corridor.commuter" }
    note: "line width = trips that followed the segment"

layers:
  # ── 1 Station flows ───────────────────────────────────────────────────────
  flows_intro:
    file: system_profile.json
    scope: global
    field: kpi
    render: text
    show_if: { station: false }
    title: "How Glasgow used its bike share"
    body: >-
      {summary.trips} trips between {summary.stations} nextbike stations, Sep 2017 to Apr 2024.
      Weekdays carry about {weekday_per_day} trips a day with a double commuting peak; weekend
      days carry {weekend_per_day}, spread across the afternoon. Click a station to see where
      its riders come from and go to, and switch between weekdays and weekends to watch the
      pattern change. Press play under the map for a standard day.

  system_kpi:
    file: system_profile.json
    scope: global
    field: kpi
    render: kpi
    show_if: { station: false }
    title: "Weekdays vs weekends"
    items:
      - { key: weekday_per_day, label: "Trips per weekday", dp: 0, colour: "$daytype.weekday" }
      - { key: weekend_per_day, label: "Trips per weekend day", dp: 0, colour: "$daytype.weekend" }
      - { key: weekday_peak_hour, label: "Weekday peak hour", dp: 0, unit: ":00", colour: "$daytype.weekday" }
      - { key: weekend_peak_hour, label: "Weekend peak hour", dp: 0, unit: ":00", colour: "$daytype.weekend" }

  system_hourly:
    file: system_profile.json
    scope: global
    field: rows
    render: bar
    orientation: vertical
    show_if: { station: false }
    title: "A standard weekday and weekend day"
    subtitle: "Average trips started per hour across the network, 06:00-23:00"
    x_key: hour
    x_suffix: ":00"
    marker: hour
    series:
      - { key: weekday, label: "Weekday", colour: "$daytype.weekday" }
      - { key: weekend, label: "Weekend day", colour: "$daytype.weekend" }
    y_label: "trips per day"

  system_shift:
    file: system_profile.json
    scope: global
    field: shift
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Weekday hubs, weekend hotspots"
    subtitle: "Share of all trips starting or ending at each station; the busiest 10 on weekdays and at weekends, sorted by the shift towards weekends"
    label_key: station
    unit: "%"
    dumbbell:
      a: { key: weekday_share, label: "Weekdays", colour: "$daytype.weekday" }
      b: { key: weekend_share, label: "Weekends", colour: "$daytype.weekend" }
    tip_keys:
      - { key: weekday_trips, label: "Weekday trips", dp: 0 }
      - { key: weekend_trips, label: "Weekend trips", dp: 0 }

  od_split_kpi:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    render: kpi
    title: "Origin vs destination, {daytype}"
    items:
      - { key: out_trips, label: "Trips starting here", dp: 0 }
      - { key: in_trips, label: "Trips ending here", dp: 0 }
      - { key: out_share, label: "Origin share", unit: "%", dp: 1, colour: "$roles.origin" }
      - { key: in_share, label: "Destination share", unit: "%", dp: 1, colour: "$roles.destination" }

  od_top_destinations:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    field: top_dest
    render: bar
    orientation: horizontal
    title: "Top 10 destinations, {daytype}"
    subtitle: "Where trips starting here go"
    label_key: station
    value_key: trips
    share_key: share
    colour: "$roles.origin"
    map_lines: { role: origin, colour: "$roles.origin" }

  od_top_origins:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    field: top_orig
    render: bar
    orientation: horizontal
    title: "Top 10 origins, {daytype}"
    subtitle: "Where trips ending here started"
    label_key: station
    value_key: trips
    share_key: share
    colour: "$roles.destination"
    map_lines: { role: destination, colour: "$roles.destination" }

  od_compare_dest:
    file: od_by_station.json
    scope: station
    field: compare.dest
    render: bar
    orientation: horizontal
    title: "Destinations: weekday vs weekend"
    subtitle: "Share of trips starting here that end at each partner; the top 10 of each day type, sorted by the shift towards weekends"
    label_key: station
    unit: "%"
    dumbbell:
      a: { key: weekday_share, label: "Weekdays", colour: "$daytype.weekday" }
      b: { key: weekend_share, label: "Weekends", colour: "$daytype.weekend" }
    tip_keys:
      - { key: weekday_trips, label: "Weekday trips", dp: 0 }
      - { key: weekend_trips, label: "Weekend trips", dp: 0 }

  od_compare_orig:
    file: od_by_station.json
    scope: station
    field: compare.orig
    render: bar
    orientation: horizontal
    title: "Origins: weekday vs weekend"
    subtitle: "Share of trips ending here that started at each partner; the top 10 of each day type, sorted by the shift towards weekends"
    label_key: station
    unit: "%"
    dumbbell:
      a: { key: weekday_share, label: "Weekdays", colour: "$daytype.weekday" }
      b: { key: weekend_share, label: "Weekends", colour: "$daytype.weekend" }
    tip_keys:
      - { key: weekday_trips, label: "Weekday trips", dp: 0 }
      - { key: weekend_trips, label: "Weekend trips", dp: 0 }

  od_hourly_split:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    field: hourly
    render: bar
    orientation: vertical
    stacked: true
    percent: true
    title: "Origin vs destination by hour, {daytype}"
    subtitle: "Share of trips starting (blue) vs ending (red) here, 06:00-23:00"
    x_key: hour
    x_suffix: ":00"
    marker: hour
    series:
      - { key: out, label: "Origin (trips start here)", colour: "$roles.origin" }
      - { key: in, label: "Destination (trips end here)", colour: "$roles.destination" }
    y_label: "% of trips"

  # ── 2 Neighbourhoods ──────────────────────────────────────────────────────
  nbhd_intro:
    scope: global
    render: text
    show_if: { station: false }
    title: "Who lives and works around each station"
    body: >-
      The dissertation described every station by the census data zones within 150 to 750 m
      of it (age, students, cars, health, socio-economic class, commuting distance) plus the
      pubs, bars and restaurants licensed nearby. These are the controls in the regression on
      the last page. Pick a variable to colour the station buffers, or switch to the
      residents-versus-workplace view to see which stations sit in job-rich and which in
      residential areas.

  census_kpi:
    file: census_summary.json
    scope: global
    path: [rank, $census_var, $buffer]
    render: kpi
    show_if: { station: false, nbhd_mode: buffers }
    title: "{census_var}, {buffer} buffer"
    items:
      - { key: median, label: "Median station", dp: 2 }
      - { key: mean, label: "Mean", dp: 2 }
      - { key: min, label: "Lowest", dp: 2 }
      - { key: max, label: "Highest", dp: 2 }

  census_top:
    file: census_summary.json
    scope: global
    path: [rank, $census_var, $buffer, top]
    render: bar
    orientation: horizontal
    show_if: { station: false, nbhd_mode: buffers }
    title: "Highest: {census_var}"
    label_key: station
    value_key: value
    colour: "$scale.high"

  census_bottom:
    file: census_summary.json
    scope: global
    path: [rank, $census_var, $buffer, bottom]
    render: bar
    orientation: horizontal
    show_if: { station: false, nbhd_mode: buffers }
    title: "Lowest: {census_var}"
    label_key: station
    value_key: value
    colour: "$scale.low"

  balance_kpi:
    file: census_summary.json
    scope: global
    path: [balance_kpi, $buffer]
    render: kpi
    show_if: { station: false, nbhd_mode: bars }
    title: "Residents vs workplace population, {buffer} buffer"
    items:
      - { key: residents, label: "Residents 16+ (all buffers)", dp: 0, colour: "$balance.residents" }
      - { key: workplace, label: "Workplace population", dp: 0, colour: "$balance.workplace" }
      - { key: job_rich, label: "Job-rich stations (workplace > residents)", dp: 0 }
      - { key: residential, label: "Residential stations", dp: 0 }

  balance_top:
    file: census_summary.json
    scope: global
    path: [balance, $buffer]
    render: bar
    orientation: horizontal
    show_if: { station: false, nbhd_mode: bars }
    title: "Most job-rich stations"
    subtitle: "Residents aged 16+ vs people working within the buffer"
    label_key: station
    head: 10
    dumbbell:
      a: { key: residents, label: "Residents 16+", colour: "$balance.residents" }
      b: { key: workplace, label: "Workplace population", colour: "$balance.workplace" }
    tip_keys:
      - { key: workplace_pct, label: "Workplace share", dp: 1, unit: "%" }

  balance_bottom:
    file: census_summary.json
    scope: global
    path: [balance, $buffer]
    render: bar
    orientation: horizontal
    show_if: { station: false, nbhd_mode: bars }
    title: "Most residential stations"
    label_key: station
    tail: 10
    dumbbell:
      a: { key: residents, label: "Residents 16+", colour: "$balance.residents" }
      b: { key: workplace, label: "Workplace population", colour: "$balance.workplace" }
    tip_keys:
      - { key: workplace_pct, label: "Workplace share", dp: 1, unit: "%" }

  station_profile:
    file: census_by_station.json
    scope: station
    field_from_state: buffer
    render: kpi
    compact: true
    title: "Neighbourhood, {buffer} buffer"
    subtitle: "Census 2022 data zones intersecting the buffer; licensed premises within it"
    items_from: { file: census_summary.json, field: vars }

  # ── 3 Cycle infrastructure ────────────────────────────────────────────────
  infra_intro:
    scope: global
    render: text
    title: "Cycle infrastructure arrived while the system was running"
    body: >-
      Glasgow City Council's open cycle-route network, dated segment by segment from scheme
      opening records; anything undated was already in place at the study start. Drag the
      slider or press play to watch routes and docking stations appear. The regression uses
      each station pair's exposure to this network, so a route that gained a segregated lane
      part-way through the study changes exposure for every trip after that date.

  infra_km_timeline:
    file: infra_timeline.json
    scope: global
    render: line
    title: "Cycle infrastructure open, km"
    subtitle: "Cumulative by type; dashed line = docking stations live"
    x_key: dates
    marker: date
    fill: true
    stacked: true
    series:
      - { key: segregated, label: "Segregated", colour: "$infra.segregated" }
      - { key: lane, label: "Cycle lane", colour: "$infra.lane" }
      - { key: shared, label: "Shared path/footway", colour: "$infra.shared" }
      - { key: mixed, label: "Mixed traffic", colour: "$infra.mixed" }
    secondary:
      { key: stations, label: "Stations live", colour: "$ui.station", y_label: "stations" }
    y_label: "km"
    unit: " km"

  infra_state_kpi:
    file: infra_timeline.json
    scope: global
    render: kpi
    title: "At the selected date"
    at_marker: date
    items:
      - { key: any, label: "Infrastructure open", unit: " km", dp: 1 }
      - { key: segregated, label: "Segregated", unit: " km", dp: 1, colour: "$infra.segregated" }
      - { key: lane, label: "Cycle lane", unit: " km", dp: 1, colour: "$infra.lane" }
      - { key: shared, label: "Shared", unit: " km", dp: 1, colour: "$infra.shared" }
      - { key: stations, label: "Stations live", dp: 0 }

  # ── 4 Commuter corridors ──────────────────────────────────────────────────
  corridors_intro:
    file: corridor_network.json
    scope: global
    render: text
    show_if: { station: false }
    title: "Commuter and non-commuter corridors"
    body: >-
      A k-means clustering of each station pair's pre-COVID timing (peak share, weekday to
      weekend ratio, direction reversal, midday share) separated commuter corridors from
      everything else. {commuter_pct}% of all trips run on commuter corridors. Pairs with too
      few trips to classify are counted as non-commuter, as in the regression. Street width
      shows how many trips' shortest bike route used that street; click a station for its own
      corridors.

  corridor_network_kpi:
    file: corridor_network.json
    scope: global
    render: kpi
    show_if: { station: false }
    title: "Corridors across the network"
    subtitle: "k-means label of each station pair (pre-COVID, pairs with 30+ trips)"
    items:
      - { key: commuter_pct, label: "Trips on commuter corridors", unit: "%", dp: 1, colour: "$corridor.commuter" }
      - { key: noncommuter_pct, label: "Trips on non-commuter corridors", unit: "%", dp: 1, colour: "$corridor.non-commuter" }
      - { key: commuter_pairs, label: "Commuter pairs", dp: 0 }
      - { key: noncommuter_pairs, label: "Non-commuter pairs", dp: 0 }
      - { key: exp_any_pct, label: "Route km on cycle infrastructure", unit: "%", dp: 1, colour: "$infra.lane" }
      - { key: classified_pct, label: "Trips on pairs the clustering labelled", unit: "%", dp: 1 }

  commuter_kpi:
    file: context_by_station.json
    scope: station
    render: kpi
    title: "Commuter character"
    items:
      - { key: commuter_pct, label: "Trips on commuter corridors", unit: "%", dp: 1, colour: "$corridor.commuter" }
      - { key: commuter_pairs, label: "Commuter partners", dp: 0 }
      - { key: exp_any, label: "Route on infrastructure", unit: "%", dp: 1, colour: "$infra.lane" }
      - { key: classified_pct, label: "Trips on labelled pairs", unit: "%", dp: 1 }

  corridor_top:
    file: context_by_station.json
    scope: station
    field: corridors
    render: bar
    orientation: horizontal
    title: "Busiest corridors"
    subtitle: "Trips in both directions, coloured by k-means commuter label"
    label_key: station
    value_key: trips
    colour_key: commuter
    colour_map: "$corridor"
    map_lines: { role: both, colour_key: commuter, colour_map: "$corridor" }

  corridor_exposure:
    file: context_by_station.json
    scope: station
    field: corridors
    render: bar
    orientation: horizontal
    title: "Route on cycle infrastructure"
    subtitle: "% of each corridor's shortest bike route within 15 m of infrastructure"
    label_key: station
    value_key: exp_any
    unit: "%"
    max: 100
    colour: "$infra.lane"

  station_exposure:
    file: context_by_station.json
    scope: station
    field: exposure
    render: bar
    orientation: horizontal
    title: "Infrastructure exposure, all trips"
    subtitle: "Trip-weighted share of route km by infrastructure type"
    unit: "%"
    max: 100
    rows:
      - { key: segregated, label: "Segregated", colour: "$infra.segregated" }
      - { key: lane, label: "Cycle lane", colour: "$infra.lane" }
      - { key: shared, label: "Shared path/footway", colour: "$infra.shared" }
      - { key: mixed, label: "Mixed traffic", colour: "$infra.mixed" }

  # ── 5 Regression ──────────────────────────────────────────────────────────
  regression_intro:
    file: regression.json
    scope: global
    field: headline
    render: text
    title: "Does cycle infrastructure attract bike-share trips?"
    body: >-
      A negative-binomial gravity model of trips between every pair of stations
      ({n_pairs} pairs, offset for the days both were live). Distance and the destination's
      workplace population behave as gravity predicts. Segregated infrastructure on its own
      has a small, uncertain effect, but on commuter corridors the effect is large: a
      commuter pair whose whole route is segregated is predicted to carry {irr_full}x the
      trips of one with none (95% CI {irr_lo} to {irr_hi}). At the median commuter exposure
      that is a {irr_median}x uplift. The map shows the segregated segments and how many
      trips' routes followed them.

  regression_headline:
    file: regression.json
    scope: global
    field: headline
    render: kpi
    title: "Headline results"
    items:
      - { key: irr_full, label: "Commuter pair, fully segregated route: trip rate ratio", dp: 2, unit: "x", colour: "$corridor.commuter" }
      - { key: irr_median, label: "At median commuter exposure (10% of route)", dp: 2, unit: "x", colour: "$corridor.commuter" }
      - { key: commuter_irr, label: "Commuter pair vs other, same exposure", dp: 2, unit: "x" }
      - { key: pearson_r, label: "Pearson r, predicted vs observed", dp: 2 }

  regression_irr:
    file: regression.json
    scope: global
    field: irr_curve
    render: line
    title: "Segregated infrastructure and trips, by corridor type"
    subtitle: "Predicted trip rate relative to an identical pair with no segregated route"
    x_key: x_pct
    x_type: number
    x_unit: "%"
    x_label: "share of route on segregated infrastructure"
    y_label: "trip rate ratio"
    unit: "x"
    ref_line: 1
    series:
      - { key: commuter, label: "Commuter pairs", colour: "$corridor.commuter" }
      - { key: non_commuter, label: "Non-commuter pairs", colour: "$corridor.non-commuter" }

  regression_forest:
    file: regression.json
    scope: global
    field: forest
    render: bar
    orientation: horizontal
    title: "Coefficient plot"
    subtitle: "Log trip-rate effect per unit with 95% intervals: thin grey = naive, thick = two-way clustered by origin and destination station"
    label_key: label
    ref_line: 0
    colour_key: group
    colour_map: "$regression"
    intervals:   # thick clustered bar first, thin naive bar drawn on top of it
      - { lo_key: cluster_lo, hi_key: cluster_hi, point_key: coef, label: "Two-way clustered 95% CI", thickness: 9 }
      - { lo_key: naive_lo, hi_key: naive_hi, label: "Naive 95% CI", colour: "$ui.ink", thickness: 2 }
    tip_keys:
      - { key: coef, label: "Coefficient", dp: 3 }
      - { key: irr, label: "Rate ratio (exp)", dp: 2, unit: "x" }
      - { key: p_cluster, label: "p, clustered", dp: 3 }
      - { key: p_naive, label: "p, naive", dp: 3 }

  regression_ladder:
    file: regression.json
    scope: global
    field: ladder
    render: bar
    orientation: horizontal
    title: "Building the model"
    subtitle: "Drop in AIC as each block of variables is added (larger = more explanatory power)"
    label_key: added
    value_key: aic_drop
    colour: "$ui.accent"
    tip_keys:
      - { key: model, label: "Model" }
      - { key: aic, label: "AIC", dp: 0 }
      - { key: llf, label: "Log-likelihood", dp: 0 }

  segregated_kpi:
    file: segregated_summary.json
    scope: global
    field_from_state: seg_mode
    render: kpi
    title: "Trips that followed segregated infrastructure"
    subtitle: "Route within 15 m of a segregated segment for 30 m or more"
    items:
      - { key: share_pct, label: "Share of trips", unit: "%", dp: 1, colour: "$infra.segregated" }
      - { key: trips_on, label: "Trips", dp: 0 }
      - { key: pairs_on, label: "Station pairs", dp: 0 }
      - { key: trips_total, label: "Of all trips considered", dp: 0 }

  segregated_top:
    file: segregated_summary.json
    scope: global
    field_from_state: seg_mode
    field: top
    render: bar
    orientation: horizontal
    title: "Most-used segregated routes"
    subtitle: "Trips whose route followed the street or scheme"
    label_key: name
    value_key: trips
    colour: "$infra.segregated"

# Views are the side-panel tabs, in story order. Each lists layers in display
# order (station layers only render once a station is selected; `show_if`
# hides others) and says what the map should overlay while the tab is active.
#   map.stations: sized (radius by trips) | dots (uniform) | "$state_key"
#                 resolving to buffers (census choropleth) | bars (2.5D columns)
#   map.select:   false disables station selection (no pointer, no picker)
#   map.timeline: none | dates (date slider) | hours (standard-day player)
#   map.infra:    none | all | timeline | segregated
#   map.loads:    none | corridor (city-wide flow map when no station selected)
#   map.heat:     none | premises (toggleable heat layer)
#   legend:       ordered legend groups; every entry is a show/hide toggle
#   controls:     control names rendered in the legend
views:
  flows:
    title: "Station flows"
    phase: 1
    layers: [flows_intro, system_kpi, system_hourly, system_shift,
             od_split_kpi, od_top_destinations, od_top_origins, od_compare_dest, od_compare_orig, od_hourly_split]
    map: { lines: [od_top_destinations, od_top_origins], infra: none, loads: none, heat: none, timeline: hours, stations: sized, select: true }
    controls: [daytype]
    legend: [lines, stations]
