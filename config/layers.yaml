# Layer manifest. The site is ONE scrolling page: `page` holds the intro and
# the variable notes, `views` are the page sections in scroll order, and every
# renderable panel is a `layers` entry: which JSON file it reads, which field
# inside the per-station object, and which GENERIC renderer draws it. The build copies this (plus colours.yaml) into web/data/manifest.json
# and the JS never hard-codes a panel. Adding a view = a build function that
# writes JSON + an entry here.
#
# Renderers (web/js/renderers.js):
#   bar   - Chart.js bar. meta: orientation (horizontal|vertical), series
#           ([{key,label,colour}]) OR value_key + colour, label_key, stacked,
#           percent (normalise each category to 100), colour_key + colour_map
#           (per-bar colour by a category field), x_key (for vertical charts),
#           intervals ([{lo_key,hi_key,point_key,label,colour,thickness}] ->
#           floating bars, e.g. a coefficient plot), dumbbell ({a:{key,label,
#           colour}, b:{...}} -> two points joined by a bar), ref_line (x value
#           for a dashed guide) or ref_key (read it from the data object, whose
#           `rows` array is then the bars), tip_keys ([{key,label,dp,unit}] extra tooltip
#           lines), marker (state key highlighted on the x axis).
#   line  - Chart.js multi-line series. meta: x_key, x_type (date|number),
#           x_unit, x_label, series, fill, stacked, secondary, y_label, unit,
#           ref_line, marker (name of a state value to draw a vertical guide at).
#   kpi   - stat tiles / key-value grid. meta: items [{key,label,unit,dp}] or
#           items_from {file, field} (metadata object {key: {label,unit,dp}}),
#           at_marker (index a timeline by a state value), compact.
#   text  - a short narrative card. meta: body (HTML; {key} placeholders are
#           filled from the layer's data object, {summary.key} from the build
#           summary, {note} from page.notes[state[note_state]]).
#   scatter - Plotly scatter of rows with 1-3 switchable numeric metrics
#           (strip / 2D / 3D). meta: metrics_from, colour_key + colour_map,
#           label_keys, select (state key that receives the selected rows).
#   table - rows from a state key (select above) as a compact list. meta:
#           rows_from_state, columns [{key,label,dp,unit}], limit, empty.
#
# Data lookup (web/js/data.js layerData):
#   scope: station     -> files[file][S.station]
#   scope: global      -> files[file]
#   field_from_state   -> one or more extra hops through S[<key>] (string|list)
#   field              -> final hop(s); dotted paths allowed ("compare.dest")
#   path               -> explicit ordered hops instead of the two above; a
#                         "$key" hop reads S[key] (e.g. [rank, $census_var, $buffer])
#   Titles and subtitles may use {daytype}, {buffer}, {census_var} placeholders
#   which are replaced by the active control's option label; any other {key}
#   is filled from the layer's data object when it is one (not a row list).
#
# Visibility: `show_if` is a map of state conditions that must all hold, e.g.
#   { station: false } (no station selected), { nbhd_mode: buffers }.
#   Station-scope layers are skipped without a station regardless.

# ── The page: intro, section groups and the variable notes ─────────────────
# Every text here is a first draft to be rewritten. {summary.key} placeholders
# are filled from the build summary.
page:
  title: "Glasgow Bike-Share Explorer"
  subtitle: "Commuter-specific effects of segregated cycle infrastructure on bike-share use in Glasgow · MSc Urban Analytics, University of Glasgow"
  intro: >-
    Increasing active travel as a mode of transportation is a key policy goal of the Scottish 
    Government. Active travel provides health benefits to the population while reducing 
    dependence on private cars and the associated greenhouse gas emissions. Central to the aim 
    of increasing active travel use is the improvement of active travel infrastructure. My dissertation
    applied a negative binomial gravity model to 11,060 origin-destination pairs 
    derived from data of 1,202,020 trips taken using Glasgow’s nextbike bike sharing system. 
    Of the 11,060 origin-destination pairs 766 were identified as commuter corridors through k
    means clustering. Segregated lane infrastructure was found to be associated with a higher rate 
    of trips, an effect concentrated on commuter corridors (IRR 3.30 per unit of exposure) and 
    retained statistical significance under two-way Cameron, Gelbach, Miller clustering. The following
    maps and graphs display the data and the regression results, alongside the station-level variables
    used in the regression model.
  headline:
    - { file: manifest, key: trips, label: "trips analysed", dp: 0 }
    - { file: manifest, key: stations, label: "docking stations", dp: 0 }
    - { file: kmeans.json, path: [clusters, commuter, n], label: "commuter corridors (station pairs)", dp: 0 }
    - { file: regression.json, path: [headline, irr_full], label: "trip rate on a fully segregated commuter route", dp: 2, unit: "x" }
  groups:
    neighbourhoods:
      title: "Surrounding Neighbourhood"
      number: "2"
      body: >-
        The surrounding characteristics of each station influence its usage. The following three maps display the
        station-level variables included within the regression model.
  # Short descriptions of each station variable, from the dissertation's
  # methodology. Shown with the census map ({note}) and in the section texts.
  notes:
    avg_age: >-
      the average age of residents within each buffer was calulcated using data from Scottish Census 2022 output areas.
    avg_health_score: >-
      average health was calculated using the Census self-reported health ratings these range from very bad (1) to very good (5); the buffer value is
      the mean response.
    avg_cars_per_household: >-
      the average number of cars or vans reported per household, ("four or more" was counted as four).
    cycling_distance_share_ext: >-
      share of commuters travelling 2 to 20 km to work. Under 2 km people were assumed to walk,
      and 20 km was taken as the furthest anyone would reasonably cycle to work.
    avg_nssec_score: >-
      the National Statistics Socio-economic Classification is scored from 1
      (employers in large establishments) to 14 (never worked or long-term unemployed), with
      full-time students left out. The average score for each buffer zone was caculated - a lower average would suggest lower deprivation.
    student_share: >-
      full-time students as a share of the buffer's population. Studies have shown that students are a large proportion of
      bike-share users, so stations with a higher student share were expected to have more trips.
    male_female_ratio: >-
      male residents per female resident.
    over16pop: >-
      Residents aged 16+ count at both ends of a trip: someone who rides to work in the
      morning usually rides home to the station nearest where they live in the evening.
    workplace_pop: >-
      Workplace population (people who work in the buffer, wherever they live) counts only at
      the destination: the weekday morning peak pulls commuters into job-rich stations, but
      they disperse before heading home in the evening.
    n_on_premises: >-
      Premises licensed for alcohol to be drunk on site stand in for the night-time economy:
      concerts, theatres, sports and nights out. The count within the buffer entered the model
      at the destination only, since people may cycle out for the evening but are less likely
      to cycle home.
    premises_capacity: >-
      the summed licensed capacity of those premises.

controls:
  # Rendered in the map legend; each sets one state key and re-renders.
  daytype:
    label: "Days"
    state: daytype
    widget: radio
    hash: day
    options:
      - { value: all, label: "All days", colour: "$ui.station" }
      - { value: weekday, label: "Weekdays", colour: "$daytype.weekday" }
      - { value: weekend, label: "Weekends", colour: "$daytype.weekend" }
  census_var:
    label: "Variable"
    state: census_var
    widget: select
    hash: var
    options_from: { file: census_summary.json, field: vars }
    exclude: [n_on_premises, premises_capacity, over16pop, workplace_pop, cycling_distance_share_ext, male_female_ratio]
  buffer:
    label: "Buffer"
    state: buffer
    widget: radio
    hash: buf
    options:
      - { value: "150", label: "150 m" }
      - { value: "250", label: "250 m" }
      - { value: "500", label: "500 m" }
  segmode:
    label: "Segregated"
    state: seg_mode
    widget: radio
    hash: seg
    options:
      - { value: all, label: "All trips", colour: "$infra.segregated" }
      - { value: commuter, label: "Commuter corridors only", colour: "$corridor.commuter" }
    note: "line width = trips that followed the segment"

layers:
  # ── 1 Station flows ───────────────────────────────────────────────────────
  flows_intro:
    file: system_profile.json
    scope: global
    field: kpi
    render: text
    title: "How Glasgow used its bike share"
    body: >-
      The data includes {summary.trips} trips between {summary.stations} nextbike stations, between September 2017
      to April 2024. Weekdays carry about {weekday_per_day} trips a day with a morning and an
      evening commuting peak; weekend days carry {weekend_per_day}, spread across the afternoon.
      The station size varies depending on how many trips start or end there. Clicking a station reveals its top five
      origins and destinations. Through selecting in the legend you can compare weekdays with weekends.
      Pressing play under the map to shows the origin destination flow of a selected day type hour by hour.

  system_kpi:
    file: system_profile.json
    scope: global
    field: kpi
    render: kpi
    show_if: { station: false }
    title: "Weekdays vs weekends"
    items:
      - { key: weekday_per_day, label: "Trips per weekday", dp: 0, colour: "$daytype.weekday" }
      - { key: weekend_per_day, label: "Trips per weekend day", dp: 0, colour: "$daytype.weekend" }
      - { key: weekday_peak_hour, label: "Weekday peak hour", dp: 0, unit: ":00", colour: "$daytype.weekday" }
      - { key: weekend_peak_hour, label: "Weekend peak hour", dp: 0, unit: ":00", colour: "$daytype.weekend" }

  system_hourly:
    file: system_profile.json
    scope: global
    field: rows
    render: bar
    orientation: vertical
    show_if: { station: false }
    title: "A standard weekday and weekend day"
    subtitle: "Average trips started per hour across the network, 06:00-23:00"
    x_key: hour
    x_suffix: ":00"
    marker: hour
    series:
      - { key: weekday, label: "Weekday", colour: "$daytype.weekday" }
      - { key: weekend, label: "Weekend day", colour: "$daytype.weekend" }
    y_label: "trips per day"

  system_shift:
    file: system_profile.json
    scope: global
    field: shift
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Weekday hubs, weekend hotspots"
    subtitle: "Share of all trips starting or ending at each station; the busiest 10 on weekdays and at weekends, sorted by the shift towards weekends"
    label_key: station
    unit: "%"
    dumbbell:
      a: { key: weekday_share, label: "Weekdays", colour: "$daytype.weekday" }
      b: { key: weekend_share, label: "Weekends", colour: "$daytype.weekend" }
    tip_keys:
      - { key: weekday_trips, label: "Weekday trips", dp: 0 }
      - { key: weekend_trips, label: "Weekend trips", dp: 0 }

  od_split_kpi:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    render: kpi
    title: "Origin vs destination, {daytype}"
    items:
      - { key: out_trips, label: "Trips starting here", dp: 0 }
      - { key: in_trips, label: "Trips ending here", dp: 0 }
      - { key: out_share, label: "Origin share", unit: "%", dp: 1, colour: "$roles.origin" }
      - { key: in_share, label: "Destination share", unit: "%", dp: 1, colour: "$roles.destination" }

  od_top_destinations:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    field: top_dest
    render: bar
    orientation: horizontal
    title: "Top 5 destinations, {daytype}"
    head: 5
    subtitle: "Where trips starting here go"
    label_key: station
    value_key: trips
    share_key: share
    colour: "$roles.origin"
    map_lines: { role: origin, colour: "$roles.origin" }

  od_top_origins:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    field: top_orig
    render: bar
    orientation: horizontal
    title: "Top 5 origins, {daytype}"
    head: 5
    subtitle: "Where trips ending here started"
    label_key: station
    value_key: trips
    share_key: share
    colour: "$roles.destination"
    map_lines: { role: destination, colour: "$roles.destination" }

  od_compare_dest:
    file: od_by_station.json
    scope: station
    field: compare.dest
    render: bar
    orientation: horizontal
    title: "Destinations: weekday vs weekend"
    subtitle: "Share of trips starting here that end at each partner; the top 10 of each day type, sorted by the shift towards weekends"
    label_key: station
    unit: "%"
    dumbbell:
      a: { key: weekday_share, label: "Weekdays", colour: "$daytype.weekday" }
      b: { key: weekend_share, label: "Weekends", colour: "$daytype.weekend" }
    tip_keys:
      - { key: weekday_trips, label: "Weekday trips", dp: 0 }
      - { key: weekend_trips, label: "Weekend trips", dp: 0 }

  od_compare_orig:
    file: od_by_station.json
    scope: station
    field: compare.orig
    render: bar
    orientation: horizontal
    title: "Origins: weekday vs weekend"
    subtitle: "Share of trips ending here that started at each partner; the top 10 of each day type, sorted by the shift towards weekends"
    label_key: station
    unit: "%"
    dumbbell:
      a: { key: weekday_share, label: "Weekdays", colour: "$daytype.weekday" }
      b: { key: weekend_share, label: "Weekends", colour: "$daytype.weekend" }
    tip_keys:
      - { key: weekday_trips, label: "Weekday trips", dp: 0 }
      - { key: weekend_trips, label: "Weekend trips", dp: 0 }

  od_hourly_split:
    file: od_by_station.json
    scope: station
    field_from_state: daytype
    field: hourly
    render: bar
    orientation: vertical
    stacked: true
    percent: true
    title: "Origin vs destination by hour, {daytype}"
    subtitle: "Share of trips starting (blue) vs ending (red) here, 06:00-23:00"
    x_key: hour
    x_suffix: ":00"
    marker: hour
    series:
      - { key: out, label: "Origin (trips start here)", colour: "$roles.origin" }
      - { key: in, label: "Destination (trips end here)", colour: "$roles.destination" }
    y_label: "% of trips"

  # ── 2 Neighbourhoods ──────────────────────────────────────────────────────
  census_intro:
    scope: global
    render: text
    note_state: census_var
    title: ""
    body: >-
      Every station was described by the Census 2022 output areas within or touching a
      buffer around it, the study used a 250m buffer; (150m and 500m are shown for comparison). These
      are control variables in the regression model. The map colours the output areas themselves;
      click a station to draw its buffer, filled with the average of the buffer size selected.
      <br><br><b>{census_var}:</b> {note}

  balance_intro:
    scope: global
    render: text
    title: ""
    body: >-
      The gravity model used three mass terms: residents aged 16+ at both ends of a trip
      and workplace population at the destination. {note_over16pop} {note_workplace_pop}
      The map displays a comparison between the population totals within the buffer zone of each station.

  premises_intro:
    scope: global
    render: text
    title: ""
    body: >-
      {note_n_on_premises} The heat map shows every on-permise alochol sales licence in the city; the
      panel ranks stations by how many fall inside their buffer.
      In the regression this was used as a control variable at the destination only, as it was 
      assumed people are more likely to cycle to a night out than to cycle home from one.

  census_kpi:
    file: census_summary.json
    scope: global
    path: [rank, $census_var, $buffer]
    render: kpi
    show_if: { station: false }
    title: "{census_var}, {buffer} buffer"
    items:
      - { key: median, label: "Median station", dp: 2 }
      - { key: mean, label: "Mean", dp: 2 }
      - { key: min, label: "Lowest", dp: 2 }
      - { key: max, label: "Highest", dp: 2 }

  census_top:
    file: census_summary.json
    scope: global
    path: [rank, $census_var, $buffer, top]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Highest: {census_var}"
    label_key: station
    value_key: value
    colour: "$scale.high"

  census_bottom:
    file: census_summary.json
    scope: global
    path: [rank, $census_var, $buffer, bottom]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Lowest: {census_var}"
    label_key: station
    value_key: value
    colour: "$scale.low"

  balance_kpi:
    file: census_summary.json
    scope: global
    path: [balance_kpi, $buffer]
    render: kpi
    show_if: { station: false }
    title: "Residents vs workplace population, {buffer} buffer"
    subtitle: "Summed over every station's buffer"
    items:
      - { key: residents, label: "Residents 16+", dp: 0, colour: "$balance.residents" }
      - { key: workplace, label: "Workplace population", dp: 0, colour: "$balance.workplace" }
      - { key: job_rich, label: "Job-rich stations (workplace > residents)", dp: 0 }
      - { key: residential, label: "Residential stations", dp: 0 }

  balance_top:
    file: census_summary.json
    scope: global
    path: [balance, $buffer]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Most job-rich stations"
    subtitle: "Residents aged 16+ vs people working within the buffer"
    label_key: station
    head: 10
    dumbbell:
      a: { key: residents, label: "Residents 16+", colour: "$balance.residents" }
      b: { key: workplace, label: "Workplace population", colour: "$balance.workplace" }
    tip_keys:
      - { key: workplace_pct, label: "Workplace share", dp: 1, unit: "%" }

  balance_bottom:
    file: census_summary.json
    scope: global
    path: [balance, $buffer]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Most residential stations"
    label_key: station
    tail: 10
    dumbbell:
      a: { key: residents, label: "Residents 16+", colour: "$balance.residents" }
      b: { key: workplace, label: "Workplace population", colour: "$balance.workplace" }
    tip_keys:
      - { key: workplace_pct, label: "Workplace share", dp: 1, unit: "%" }

  uplift_by_buffer:
    file: census_summary.json
    scope: global
    path: [uplift, by_buffer]
    render: bar
    orientation: vertical
    show_if: { station: false }
    title: "Jobs cluster tighter than homes"
    subtitle: "Workplace uplift: how far workplace population exceeds residents 16+ at each buffer size"
    x_key: buffer
    x_suffix: " m"
    unit: "%"
    series:
      - { key: aggregate_pct, label: "All stations pooled", colour: "$balance.workplace" }
      - { key: median_pct, label: "Median station", colour: "$balance.median" }
    y_label: "uplift"
    tip_keys:
      - { key: mean_pct, label: "Mean station", dp: 0, unit: "%" }
      - { key: job_rich, label: "Job-rich stations", dp: 0 }

  uplift_outperform:
    file: census_summary.json
    scope: global
    path: [uplift, outperform, $buffer]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Stations that beat the network uplift, {buffer} buffer"
    subtitle: "{n_above} of {n} stations have a larger workplace uplift than all stations pooled (dashed line, {benchmark_pct}%); top 15 shown"
    label_key: station
    value_key: uplift_pct
    ref_key: benchmark_pct
    unit: "%"
    colour: "$balance.workplace"
    tip_keys:
      - { key: ratio, label: "Workers per resident", dp: 1, unit: "x" }
      - { key: vs_benchmark_pp, label: "Above the network", dp: 0, unit: " pp" }
      - { key: residents, label: "Residents 16+", dp: 0 }
      - { key: workplace, label: "Workplace population", dp: 0 }

  station_uplift:
    file: census_summary.json
    scope: global
    path: [uplift, by_station, $station]
    render: bar
    orientation: vertical
    show_if: { station: true }
    title: "Workplace uplift vs the network"
    subtitle: "How far this station's workplace population exceeds its residents 16+, beside all stations pooled"
    x_key: buffer
    x_suffix: " m"
    marker: buffer
    unit: "%"
    series:
      - { key: station_pct, label: "This station", colour: "$ui.highlight" }
      - { key: network_pct, label: "All stations pooled", colour: "$balance.workplace" }
    y_label: "uplift"

  uplift_movers:
    file: census_summary.json
    scope: global
    path: [uplift, movers]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Stations that change most as the buffer widens"
    subtitle: "Change in workplace share of population, 150 m to 500 m buffer"
    label_key: station
    value_key: change_pp
    unit: "pp"
    colour_key: dir
    colour_map:
      "more job-rich": "$balance.workplace"
      "more residential": "$balance.residents"
    tip_keys:
      - { key: lo_pct, label: "Workplace share at 150 m", dp: 1, unit: "%" }
      - { key: hi_pct, label: "Workplace share at 500 m", dp: 1, unit: "%" }

  station_profile:
    file: census_by_station.json
    scope: station
    field_from_state: buffer
    render: kpi
    compact: true
    title: "Neighbourhood, {buffer} buffer"
    subtitle: "Census 2022 output areas intersecting the buffer; licensed premises within it"
    items_from: { file: census_summary.json, field: vars }

  premises_kpi:
    file: census_summary.json
    scope: global
    path: [rank, n_on_premises, $buffer]
    render: kpi
    show_if: { station: false }
    title: "Licensed premises per station, {buffer} buffer"
    items:
      - { key: median, label: "Median station", dp: 0 }
      - { key: mean, label: "Mean", dp: 1 }
      - { key: min, label: "Fewest", dp: 0 }
      - { key: max, label: "Most", dp: 0 }

  premises_top:
    file: census_summary.json
    scope: global
    path: [rank, n_on_premises, $buffer, top]
    render: bar
    orientation: horizontal
    show_if: { station: false }
    title: "Most licensed premises within {buffer}"
    label_key: station
    value_key: value
    colour: "#fd8d3c"

  premises_station:
    file: census_by_station.json
    scope: station
    render: kpi
    path: [$buffer]
    title: "Within the {buffer} buffer"
    items:
      - { key: n_on_premises, label: "Licensed premises (on-sales)", dp: 0, colour: "#fd8d3c" }
      - { key: premises_capacity, label: "Licensed capacity", dp: 0, colour: "#bd0026" }

  # ── 3 Cycle infrastructure ────────────────────────────────────────────────
  infra_intro:
    scope: global
    render: text
    title: "Cycle infrastructure arrived while the system was running"
    body: >-
      The map shows Glasgow's cycle-route network. In the study I dated each segment that was
      opened during the data collection period. Dragging the slider or pressing play shows how the network grew over the
      collection period. The regression includes exposure to the network, so a route that gained a segregated lane
      part-way through the study changed exposure for every trip after that date.

  infra_km_timeline:
    file: infra_timeline.json
    scope: global
    render: line
    title: "Cycle infrastructure open, km"
    subtitle: "Cumulative by type; dashed line = docking stations live"
    x_key: dates
    marker: date
    fill: true
    stacked: true
    series:
      - { key: segregated, label: "Segregated", colour: "$infra.segregated" }
      - { key: lane, label: "Cycle lane", colour: "$infra.lane" }
      - { key: shared, label: "Shared path/footway", colour: "$infra.shared" }
      - { key: mixed, label: "Mixed traffic", colour: "$infra.mixed" }
    secondary:
      { key: stations, label: "Stations live", colour: "$ui.station", y_label: "stations" }
    y_label: "km"
    unit: " km"

  infra_state_kpi:
    file: infra_timeline.json
    scope: global
    render: kpi
    title: "At the selected date"
    at_marker: date
    items:
      - { key: any, label: "Infrastructure open", unit: " km", dp: 1 }
      - { key: segregated, label: "Segregated", unit: " km", dp: 1, colour: "$infra.segregated" }
      - { key: lane, label: "Cycle lane", unit: " km", dp: 1, colour: "$infra.lane" }
      - { key: shared, label: "Shared", unit: " km", dp: 1, colour: "$infra.shared" }
      - { key: stations, label: "Stations live", dp: 0 }

  # ── 4 Commuter corridors ──────────────────────────────────────────────────
  corridors_intro:
    file: kmeans.json
    scope: global
    field: clusters.commuter
    render: text
    title: "Finding commuter corridors"
    body: >-
      The data included no trip purpose, so commuter corridors were found with k-means
      clustering (k = 2). Every station pair with more than 30 trips before COVID-19 (20 March
      2020) was described by three features: <b>peak share</b> (share of weekday trips in the
      07:00-10:00 and 16:00-19:00 peaks), the <b>weekday : weekend ratio</b> (logged) and
      <b>reversal</b> (does the main direction flip between morning and evening; 0 = never,
      2 = completely). {n} of {summary.kmeans_pairs} pairs landed in the cluster with the
      higher value on all three, the commuter corridors. Switch metrics on and off to see the
      clusters from each angle; click a point, lasso a group or drag the range sliders to pick
      pairs and see their routes on the map. Pairs below the 30-trip threshold count as
      non-commuter in the regression.

  kmeans_scatter:
    file: kmeans.json
    scope: global
    field: rows
    render: scatter
    metrics_from: metrics
    label_keys: [a, b]
    colour_key: c
    colour_map: { "1": "$corridor.commuter", "0": "$corridor.non-commuter" }
    colour_labels: { "1": "Commuter", "0": "Non-commuter" }
    select: pairs
    tip_keys:
      - { key: trips, label: "Trips (all time, both ways)", dp: 0 }
      - { key: pre, label: "Trips before COVID-19", dp: 0 }

  kmeans_profile:
    file: kmeans.json
    scope: global
    field: profile
    render: bar
    orientation: vertical
    title: "Cluster means"
    subtitle: "Mean of each feature in the two clusters (weekday : weekend ratio logged)"
    dp: 2
    x_key: metric
    series:
      - { key: noncommuter, label: "Non-commuter", colour: "$corridor.non-commuter" }
      - { key: commuter, label: "Commuter", colour: "$corridor.commuter" }
    tip_keys:
      - { key: n_c, label: "Commuter pairs", dp: 0 }
      - { key: n_n, label: "Non-commuter pairs", dp: 0 }

  kmeans_selection:
    render: table
    scope: global
    rows_from_state: pairs
    title: ""
    empty: "Click a point, lasso a group of points (2D) or drag the range sliders (3D) to list pairs here."
    limit: 60
    sort_key: trips
    columns:
      - { key: pair, label: "Station pair" }
      - { key: c, label: "Cluster", map: { "1": "commuter", "0": "non-commuter" } }
      - { key: trips, label: "Trips", dp: 0 }
      - { key: peak, label: "Peak", dp: 2 }
      - { key: wk, label: "Wkday:wkend", dp: 2 }
      - { key: rev, label: "Reversal", dp: 2 }

  corridor_network_kpi:
    file: corridor_network.json
    scope: global
    render: kpi
    title: "Commuter corridors across the network"
    subtitle: "Directed station pairs, all trips 2017-2024; unlabelled pairs count as non-commuter"
    items:
      - { key: commuter_pct, label: "Trips on commuter corridors", unit: "%", dp: 1, colour: "$corridor.commuter" }
      - { key: noncommuter_pct, label: "Trips on non-commuter pairs", unit: "%", dp: 1, colour: "$corridor.non-commuter" }
      - { key: commuter_pairs, label: "Commuter pairs (directed)", dp: 0 }
      - { key: classified_pct, label: "Trips on pairs the clustering labelled", unit: "%", dp: 1 }

  # ── 5 Regression ──────────────────────────────────────────────────────────
  regression_intro:
    file: regression.json
    scope: global
    field: headline
    render: text
    title: "Does cycle infrastructure attract bike-share trips?"
    body: >-
      A negative-binomial gravity model of trips between every pair of stations
      ({n_pairs} pairs, offset for the days both were live). Distance and the destination's
      workplace population behave as gravity predicts. Segregated infrastructure on its own
      has a small, uncertain effect, but on commuter corridors the effect is large: a
      commuter pair whose whole route is segregated is predicted to carry {irr_full}x the
      trips of one with none (95% CI {irr_lo} to {irr_hi}). At the median commuter exposure
      that is a {irr_median}x uplift. The map below shows the segregated segments and how many
      trips' routes followed them.

  regression_headline:
    file: regression.json
    scope: global
    field: headline
    render: kpi
    title: "Headline results"
    items:
      - { key: irr_full, label: "Commuter pair, fully segregated route: trip rate ratio", dp: 2, unit: "x", colour: "$corridor.commuter" }
      - { key: irr_median, label: "At median commuter exposure (10% of route)", dp: 2, unit: "x", colour: "$corridor.commuter" }
      - { key: commuter_irr, label: "Commuter pair vs other, same exposure", dp: 2, unit: "x" }
      - { key: pearson_r, label: "Pearson r, predicted vs observed", dp: 2 }

  regression_irr:
    file: regression.json
    scope: global
    field: irr_curve
    render: line
    title: "Segregated infrastructure and trips, by corridor type"
    subtitle: "Predicted trip rate relative to an identical pair with no segregated route"
    x_key: x_pct
    x_type: number
    x_unit: "%"
    x_label: "share of route on segregated infrastructure"
    y_label: "trip rate ratio"
    unit: "x"
    ref_line: 1
    series:
      - { key: commuter, label: "Commuter pairs", colour: "$corridor.commuter" }
      - { key: non_commuter, label: "Non-commuter pairs", colour: "$corridor.non-commuter" }

  regression_forest:
    file: regression.json
    scope: global
    field: forest
    render: bar
    orientation: horizontal
    title: "Coefficient plot"
    subtitle: "Log trip-rate effect per unit with 95% intervals: thin grey = naive, thick = two-way clustered by origin and destination station"
    label_key: label
    ref_line: 0
    colour_key: group
    colour_map: "$regression"
    intervals:   # thick clustered bar first, thin naive bar drawn on top of it
      - { lo_key: cluster_lo, hi_key: cluster_hi, point_key: coef, label: "Two-way clustered 95% CI", thickness: 9 }
      - { lo_key: naive_lo, hi_key: naive_hi, label: "Naive 95% CI", colour: "$ui.ink", thickness: 2 }
    tip_keys:
      - { key: coef, label: "Coefficient", dp: 3 }
      - { key: irr, label: "Rate ratio (exp)", dp: 2, unit: "x" }
      - { key: p_cluster, label: "p, clustered", dp: 3 }
      - { key: p_naive, label: "p, naive", dp: 3 }

  regression_ladder:
    file: regression.json
    scope: global
    field: ladder
    render: bar
    orientation: horizontal
    title: "Building the model"
    subtitle: "Drop in AIC as each block of variables is added (larger = more explanatory power)"
    label_key: added
    value_key: aic_drop
    colour: "$ui.accent"
    tip_keys:
      - { key: model, label: "Model" }
      - { key: aic, label: "AIC", dp: 0 }
      - { key: llf, label: "Log-likelihood", dp: 0 }

  segregated_kpi:
    file: segregated_summary.json
    scope: global
    field_from_state: seg_mode
    render: kpi
    title: "Trips that followed segregated infrastructure"
    subtitle: "Route within 15 m of a segregated segment for 30 m or more"
    items:
      - { key: share_pct, label: "Share of trips", unit: "%", dp: 1, colour: "$infra.segregated" }
      - { key: trips_on, label: "Trips", dp: 0 }
      - { key: pairs_on, label: "Station pairs", dp: 0 }
      - { key: trips_total, label: "Of all trips considered", dp: 0 }

  segregated_top:
    file: segregated_summary.json
    scope: global
    field_from_state: seg_mode
    field: top
    render: bar
    orientation: horizontal
    title: "Most-used segregated routes"
    subtitle: "Trips whose route followed the street or scheme"
    label_key: name
    value_key: trips
    colour: "$infra.segregated"

# Views are the page SECTIONS, in scroll order. Each one renders as:
#   heading -> `text` layers (full width) -> map + side panel (`layers`)
#   -> `wide` layers (full-width chart grid; `wide_first: true` puts it
#   before the map row). `group` joins consecutive sections under one heading
#   (page.groups). `layout: scatter` puts `scatter` beside a smaller map.
#   `fixed` pins state for the section only (e.g. the premises variable).
#   `show` overrides the legend toggles' starting state for the section.
#   map.stations: sized (radius by trips) | dots (uniform) | buffers (output-area
#                 choropleth + selected station's buffer) | bars (2.5D columns)
#   map.select:   false disables station selection (no pointer, no picker)
#   map.timeline: none | dates (date slider) | hours (standard-day player)
#   map.infra:    none | all | timeline | segregated
#   map.pairs:    state key holding selected k-means rows (routes drawn)
#   map.heat:     none | premises (toggleable heat layer)
#   map.ring:     true draws the selected station's buffer outline
#   legend:       ordered legend groups; every entry is a show/hide toggle
#   controls:     control names rendered in the legend
views:
  flows:
    title: "Station flows"
    number: "1"
    text: [flows_intro]
    layers: [system_kpi, system_hourly, system_shift,
             od_split_kpi, od_top_destinations, od_top_origins, od_compare_dest, od_compare_orig, od_hourly_split]
    map: { lines: [od_top_destinations, od_top_origins], infra: none, heat: none, timeline: hours, stations: sized, select: true }
    controls: [daytype]
    legend: [lines, stations]
    prompt: "Click a station on the map, or pick one from the list, to see its top five destinations and origins, how they differ between weekdays and weekends, and its hourly origin/destination split."
    hint: "lines follow the shortest bike-network route; press play for a standard day"

  census:
    group: neighbourhoods
    title: "Census variables"
    number: "2a"
    text: [census_intro]
    layers: [census_kpi, census_top, census_bottom, station_profile]
    map: { lines: [], infra: none, heat: none, timeline: none, stations: buffers, select: true }
    controls: [census_var, buffer]
    legend: [scale, oa, stations]
    prompt: "Click a station to see its buffer on the map and its full neighbourhood profile."
    hint: "output-area colour = value of the selected variable"

  balance:
    group: neighbourhoods
    title: "Workplace vs residential population"
    number: "2b"
    text: [balance_intro]
    layers: [balance_kpi, uplift_by_buffer, uplift_outperform, balance_top, balance_bottom, uplift_movers, station_uplift]
    map: { lines: [], infra: none, heat: none, timeline: none, stations: bars, select: true }
    controls: [buffer]
    legend: [scale]
    prompt: "Click a station's columns to compare its workplace uplift with the network's."
    hint: "column height = people in the buffer"

  premises:
    group: neighbourhoods
    title: "Licensed premises"
    number: "2c"
    text: [premises_intro]
    layers: [premises_kpi, premises_top, premises_station]
    fixed: { census_var: n_on_premises }
    show: { heat: true }
    map: { lines: [], infra: none, heat: premises, timeline: none, stations: dots, ring: true, select: true }
    controls: [buffer]
    legend: [heat, stations]
    prompt: "Click a station to count the licensed premises inside its buffer."
    hint: "heat = on-sales licensed premises (Glasgow Licensing Board)"

  timeline:
    title: "Cycle infrastructure"
    number: "3"
    panel_title: "The network at the selected date"
    text: [infra_intro]
    layers: [infra_state_kpi, infra_km_timeline]
    map: { lines: [], infra: timeline, heat: none, timeline: dates, stations: dots, select: false }
    controls: []
    legend: [infra, stations]
    hint: "drag the slider or press play; stations appear at their first trip"

  corridors:
    title: "Commuter corridors"
    number: "4"
    panel_title: "Selected station pairs"
    layout: scatter
    text: [corridors_intro]
    scatter: kmeans_scatter
    layers: [kmeans_selection]
    wide: [kmeans_profile, corridor_network_kpi]
    map: { lines: [], infra: none, heat: none, timeline: none, stations: dots, pairs: pairs, select: false }
    controls: []
    legend: [corridor, stations]
    hint: "click a point, lasso a group or drag the sliders; click a row to highlight its route"

  regression:
    title: "Regression"
    number: "5"
    panel_title: "Trips on segregated infrastructure"
    text: [regression_intro]
    wide_first: true
    wide: [regression_headline, regression_irr, regression_forest, regression_ladder]
    layers: [segregated_kpi, segregated_top]
    map: { lines: [], infra: segregated, heat: none, timeline: none, stations: dots, select: false }
    controls: [segmode]
    legend: [stations]
    map_title: "Where trips met segregated infrastructure"
    hint: "click a segment for its trip counts; switch to commuter corridors in the legend"
